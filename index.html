<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磁带柜 · Tape Shelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%23b9512d'/%3E%3Crect x='6' y='11' width='20' height='8' rx='4' fill='%23f6e7cf'/%3E%3Ccircle cx='11.5' cy='15' r='2.4' fill='%23221d16'/%3E%3Ccircle cx='20.5' cy='15' r='2.4' fill='%23221d16'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,700;1,900&family=Bebas+Neue&family=Caveat:wght@600&family=DM+Serif+Display:ital@0;1&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,700&family=Press+Start+2P&family=Righteous&family=Space+Mono:wght@400;700&family=Special+Elite&family=Unbounded:wght@700&display=swap" rel="stylesheet" id="webfonts" media="print" onload="this.media='all'">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { --paper: #efe6cf; --ink: #221d16; --dymo: #17181a; --dymo-red: #a8261c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a211d; color: var(--paper); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* lens: soft vignette and a breath of film grain over the render */
  .lens { position: fixed; inset: 0; pointer-events: none; }
  .vignette { background: radial-gradient(120% 95% at 50% 46%, rgba(0,0,0,0) 52%, rgba(8,6,3,0.5) 100%); }
  .grain { opacity: 0.11; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* embossed label-maker tape */
  .dymo {
    position: fixed; pointer-events: none; z-index: 5;
    font: 700 12px/1 "Archivo", "PingFang SC", "Helvetica Neue", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap;
    color: #f3f0e8; background: linear-gradient(#232427, #121315 60%, #1b1c1e);
    padding: 8px 13px 7px; border-radius: 1.5px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(0,0,0,0.7), 0 7px 16px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.6);
    text-shadow: 0 0 1px rgba(255,255,255,0.9), 0 1.5px 0 rgba(0,0,0,0.75), 0 -0.5px 0 rgba(255,255,255,0.35);
  }
  #tip { opacity: 0; transform: translate(-50%, -100%) rotate(-1.2deg); transition: opacity 0.12s; }
  #tip.on { opacity: 1; }
  #tip.out { background: linear-gradient(#b5372b, #8f1f16 60%, #a52b20); }

  #now { left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; background: none; box-shadow: none; padding: 0; opacity: 0; transform: translateY(8px) rotate(-0.6deg); transition: opacity 0.35s, transform 0.35s; }
  #now.on { opacity: 1; transform: translateY(0) rotate(-0.6deg); }
  #now span { position: static; display: block; width: max-content; max-width: min(78vw, 560px); overflow: hidden; text-overflow: ellipsis; }
  #now .a { background: linear-gradient(#b5372b, #8f1f16 60%, #a52b20); font-size: 13px; }
  #now .b { font-size: 10px; letter-spacing: 0.2em; padding: 6px 10px 5px; transform: translateX(10px) rotate(0.9deg); }

  /* handwritten note on masking tape */
  .note {
    position: fixed; z-index: 5; pointer-events: none; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%) rotate(-0.8deg); max-width: 92vw;
    font: 400 15px/1.5 "Hannotate SC", "HanziPen SC", "Kaiti SC", "KaiTi", "Caveat", cursive; color: #2b241a; text-align: center;
    padding: 9px 22px 8px;
    background: linear-gradient(180deg, rgba(246,236,205,0.96), rgba(233,220,184,0.96));
    box-shadow: 0 8px 20px rgba(0,0,0,0.4), inset 0 0 22px rgba(160,130,70,0.22);
    -webkit-mask: linear-gradient(90deg, transparent 0, #000 6px, #000 calc(100% - 6px), transparent 100%), repeating-linear-gradient(0deg, #000 0 3px, transparent 3px 5px); -webkit-mask-size: 100% 100%, 8px 100%; -webkit-mask-repeat: no-repeat, repeat-y; -webkit-mask-position: center, left; -webkit-mask-composite: source-over;
    transition: opacity 0.6s, transform 0.6s;
  }
  .note small { display: block; font-size: 12.5px; opacity: 0.72; }
  .note { width: max-content; }
  @media (max-width: 640px) { .note { font-size: 13px; padding: 7px 16px 6px; } .note small { font-size: 11px; } }
  /* tall layout (two shelf rows): the free wall is above the shelf */
  @media (max-aspect-ratio: 5/4) { #hint { bottom: auto; top: max(16px, env(safe-area-inset-top)); } #flash { bottom: auto; top: max(84px, 9vh); } .note.gone { transform: translateX(-50%) translateY(-14px) rotate(-0.8deg); } }
  .note.gone { opacity: 0; transform: translateX(-50%) translateY(14px) rotate(-0.8deg); }
  #flash { bottom: max(96px, 13vh); opacity: 0; }
  #flash.on { opacity: 1; }

  #veil { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity 0.2s; background: rgba(12,10,6,0.55); backdrop-filter: blur(2px); }
  #veil.on { opacity: 1; }
  #veil div { font: 400 30px/1.4 "Hannotate SC", "HanziPen SC", "Kaiti SC", cursive; color: var(--paper); border: 2px dashed rgba(239,230,207,0.6); padding: 34px 54px; border-radius: 6px; transform: rotate(-1.5deg); }

  #boot { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #15110c; transition: opacity 0.9s ease 0.15s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .reel { width: 54px; height: 54px; border-radius: 50%; border: 5px solid #cdbf9d; border-top-color: transparent; border-bottom-color: transparent; animation: spin 1.1s linear infinite; position: relative; }
  #boot .reel::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: #cdbf9d; }
  #boot p { margin: 20px 0 0; font: 400 13px/1 "Space Mono", Menlo, monospace; letter-spacing: 0.3em; color: #a89a78; text-align: center; }
  #boot .err { color: #e9917f; letter-spacing: 0.04em; max-width: 80vw; line-height: 1.6; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #boot .reel { animation: none; } }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="磁带陈列架与卡座：把磁带拖进卡座播放，或用空格键播放和停止"></canvas>
<div class="lens vignette"></div>
<div class="lens grain"></div>

<div id="hint" class="note">把一盘磁带拖进下面的卡座 · 点一下也行<small>把你自己的音频文件拖进页面，就能录到空白带上</small></div>
<div id="flash" class="note"></div>
<div id="tip" class="dymo"></div>
<div id="now" class="dymo"><span class="dymo a"></span><span class="dymo b"></span></div>
<div id="veil"><div>松手，录到一盘空白带上</div></div>
<div id="boot"><div><div class="reel" style="margin:0 auto"></div><p id="bootmsg">REWINDING…</p></div></div>

<script>
  function bootFail() {
    var p = document.getElementById('bootmsg');
    p.className = 'err';
    p.textContent = '加载失败：需要联网加载 three.js，并且要通过本地服务器打开（不能直接双击 index.html）。';
  }
</script>
<script type="module" src="./src/main.js" onerror="bootFail()"></script>
</body>
</html>
